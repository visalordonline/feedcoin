<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FeedCoin || Flutterwave Payment</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="dashboard.css" />
  <script src="https://checkout.flutterwave.com/v3.js"></script>
</head>
<body class="dash-body">
  <div class="dash-main" style="max-width: 500px; margin: 40px auto; padding: 16px;">
    <div class="glass-card section-card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2>Investment Checkout</h2>
        <a href="dashboard.html" class="btn btn-ghost btn-sm">Cancel</a>
      </div>
      <p class="muted">Complete payment using Flutterwave to activate your daily returns.</p>

      <div style="padding: 16px; background: rgba(255,255,255,0.03); border-radius: 12px; margin: 16px 0;">
        <p class="muted">Selected Plan: <strong id="planName" style="color:#fff;">Starter</strong></p>
        <h1 id="amountDisplay" style="color:var(--accent-emerald); margin-top: 8px;">₦5,000.00</h1>
      </div>

      <form id="paymentForm" class="auth-form">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="custName" value="Alex Rivers" required />
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="custEmail" value="alex@example.com" required />
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="custPhone" value="+2348000000000" required />
        </div>
        <button type="submit" class="btn btn-primary w-full" id="payBtn">Pay with Flutterwave</button>
      </form>
    </div>
  </div>

  <script src="config.js"></script>
  <script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';
    import { doc, getDoc, increment, updateDoc, setDoc } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';

    const params = new URLSearchParams(window.location.search);
    const plan = params.get('plan') || 'Starter';
    const amount = parseFloat(params.get('amount')) || 5000;

    document.getElementById('planName').textContent = plan;
    document.getElementById('amountDisplay').textContent = '₦' + amount.toLocaleString('en-NG', { minimumFractionDigits: 2 });

    const user = await new Promise(resolve => onAuthStateChanged(auth, resolve));
    if (!user) {
      window.location.href = 'index.html';
    } else {
      const profileSnapshot = await getDoc(doc(db, 'users', user.uid));
      const profile = profileSnapshot.data()?.profile;
      if (profile?.fullName) document.getElementById('custName').value = profile.fullName;
      if (profile?.email) document.getElementById('custEmail').value = profile.email;
      if (profile?.phone) document.getElementById('custPhone').value = profile.phone;
    }

    document.getElementById('paymentForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const publicKey = window.CONFIG?.FLUTTERWAVE_PUBLIC_KEY;
      if (!publicKey || !/^FLWPUBK(?:_TEST)?-/.test(publicKey)) {
        alert('Flutterwave is not configured with a valid public key. Please contact support.');
        return;
      }
      if (!Number.isFinite(amount) || amount <= 0) {
        alert('The selected investment amount is invalid.');
        return;
      }

      const email = document.getElementById('custEmail').value;
      const phone = document.getElementById('custPhone').value;
      const name = document.getElementById('custName').value;

      // Flutterwave Inline Checkout
      if (!auth.currentUser) {
        window.location.href = 'index.html';
        return;
      }
      window.FlutterwaveCheckout({
        public_key: publicKey,
        tx_ref: "FC-" + Date.now(),
        amount: amount,
        currency: "NGN",
        payment_options: "card, banktransfer, ussd",
        customer: {
          email: email,
          phone_number: phone,
          name: name,
        },
        customizations: {
          title: "FeedCoin Investment",
          description: `Payment for ${plan} plan`,
          logo: "https://feedcoin.io/logo.jpg",
        },
        callback: async function () {
          // Success callback: update active capital
          try {
            await updateDoc(doc(db, 'users', auth.currentUser.uid), {
              'balances.capital': increment(amount)
            });
            // Keep the referrer's view of this member's investment in sync
            try {
              const selfSnap = await getDoc(doc(db, 'users', auth.currentUser.uid));
              const me = selfSnap.data() || {};
              const referredBy = (me.referredBy || '').trim();
              if (referredBy) {
                await setDoc(doc(db, 'referrals', auth.currentUser.uid), {
                  referredBy,
                  memberUid: auth.currentUser.uid,
                  fullName: me.profile?.fullName || 'Member',
                  username: me.profile?.username || '',
                  invested: Number(me.balances?.capital || 0),
                  createdAt: me.createdAt || Date.now()
                }, { merge: true });
              }
            } catch (refErr) {
              console.warn('Referral record not updated:', refErr);
            }
            alert('Payment successful! Your plan is activated.');
            window.location.href = 'dashboard.html';
          } catch (error) {
            console.error('Unable to update the signed-in user balance.', error);
            alert('Payment completed, but your balance could not be updated. Please contact support.');
          }
        },
        onclose: function () {
          // Window closed
        }
      });
    });
  </script>
</body>
</html>
